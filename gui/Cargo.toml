[package]
name = "nettool-gui"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Desktop GUI for nettool: LAN discovery, port scanning, LLDP/CDP, packet capture and Wi-Fi analysis"
license = "MIT"

[lib]
name = "nettool_gui"
path = "src/lib.rs"

[[bin]]
name = "nettool-gui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 2
strip = true
