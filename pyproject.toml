[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nettool"
version = "0.1.0"
description = "Field network diagnostics: LAN discovery, port scanning, LLDP/CDP neighbors, packet capture export, and Wi-Fi signal/interference analysis"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.scripts]
nettool = "nettool.cli:main"

[tool.setuptools.packages.find]
include = ["nettool*"]
