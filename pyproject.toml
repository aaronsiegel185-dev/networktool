[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "toolbox"
version = "0.1.0"
description = "Network Tool and Assist: field network diagnostics, and a local model that works a ticket with them - with nothing leaving the machine"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.scripts]
toolbox = "toolbox.cli:main"
# Both parts keep their own command. The macOS bundle, the Windows installer and
# the Pi service all invoke `nettool` directly, and Assist is just as usable on
# its own as through the front door.
nettool = "nettool.cli:main"
assist = "assist.cli:main"

[tool.setuptools.packages.find]
include = ["toolbox*", "nettool*", "assist*"]
